<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Tests</title>
<style>
  :root { --bg: #0d1b33; --panel: #152a4d; --text: #e6eefc; --dim: #9fb3d6; --ok: #5fd38a; --bad: #ff7a70; --note: #ffd166; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #3d6bb3; background: #2a5aa8; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #state { color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 16px; padding: 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
  iframe { width: 100%; height: 680px; border: 1px solid #2c4a7c; border-radius: 6px; background: #000; }
  section { background: var(--panel); border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
  section h2 { font-size: 15px; margin: 0 0 4px; }
  .pass { color: var(--ok); } .fail { color: var(--bad); } .note { color: var(--note); }
  ul { margin: 4px 0 0; padding-left: 18px; } li { overflow-wrap: anywhere; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Editor tests</h1>
  <button id="run" type="button">Run</button>
  <span id="state">Runs the editor (right) through its checks; tests/run.py opens this page by itself.</span>
</header>
<main>
  <div id="results"></div>
  <iframe id="editor" title="Editor under test"></iframe>
</main>
<script type="module" src="js/test.js"></script>
</body>
</html>
