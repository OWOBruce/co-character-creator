# Pushing a version tag (git tag v0.5.1 && git push origin v0.5.1) builds the installer and the zip on a Windows
# runner and publishes them as a GitHub Release. The tag must match viewer/js/version.js. A version with a suffix
# (v0.7.0-rc1) is published as a pre-release, which GitHub's latest release skips, so players' update notice and
# the always-latest installer link don't offer it. Run it by hand (Actions > Release > Run workflow) to just
# build and download them.
#
# Every file it makes gets a build attestation, so anyone can check a download was built here from this repo:
#   gh attestation verify CO-Costume-Editor-Setup.exe --repo codexheroes/co-character-creator
# The actions are pinned to commits (the tag they were is in the comment), so a moved or hijacked tag can't
# change what runs; to update one, look up the new tag's commit (gh api repos/<owner>/<action>/commits/<tag>).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write           # publish the release
  id-token: write           # the attestation's signing certificate
  attestations: write       # store the attestation
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # the same version as make_release.py's PYTHON: the release bundles python.org's embeddable Python of that
      # version, and tkinter is copied from this one
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.8'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Check the tag matches viewer/js/version.js
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(python make_release.py --version)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but version.js says $v"; exit 1; }

      - name: Build the zip and installer
        run: python make_release.py --installer

      # the same installer under a name that never changes, so this link always gets the newest one:
      # https://github.com/codexheroes/co-character-creator/releases/latest/download/CO-Costume-Editor-Setup.exe
      - name: Add the installer under a fixed name
        shell: bash
        run: cp dist/CO-Costume-Editor-*-Setup.exe dist/CO-Costume-Editor-Setup.exe

      - name: Attest where the files were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/*-Setup.exe
            dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: CO Costume Editor ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*-Setup.exe
            dist/*.zip

      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: co-costume-editor
          path: |
            dist/*-Setup.exe
            dist/*.zip
